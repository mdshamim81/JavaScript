<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>

  <div id="main">
    
    <section class="allElems">
      <div class="todo elem" id="0">
        <img src="https://plus.unsplash.com/premium_photo-1710962184909-f9f8dc2c9f5f?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
        <h2>To Do List</h2>
      </div>
      <div class="daily elem" id="1">
        <img src="https://images.unsplash.com/photo-1759549567944-bb5923888826?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
        <h2>Daily Planner</h2>
      </div>
      <div class="moti elem" id="2">
        <img src="https://plus.unsplash.com/premium_photo-1711031505781-2a45c879ceac?q=80&w=415&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
        <h2>Motivation</h2>
      </div>
      <div class="pomo elem" id="3">
        <img src="https://images.unsplash.com/photo-1501139083538-0139583c060f?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
        <h2>Pomodoro Timer</h2>
      </div>
      <div class="goals elem" id="4">
        <img src="https://plus.unsplash.com/premium_photo-1671077420134-4cce62252a2d?q=80&w=1032&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
        <h2>Daily Goals</h2>
      </div>
    </section>


    <section class="fullElem todo-list-fullpage" >
      <button class="back" id="0">Close</button>
      <h2>Your personalised Task List</h2>

      <div class="todo-container">
        <div class="addTask">
          <form>
            <input id="task-input" type="text" placeholder="Enter Task">
            <textarea placeholder="Enter details" name="" id="" cols="0" rows="4"></textarea>
            <div class="mark-imp">
              <input type="checkbox" name="checkbox" id="check">
              <label for="check">Mark as Important!</label>
            </div>
            <button >Add Task</button>
          </form>
        </div>
        <div class="allTask">
          
      </div>
    </section>
    <section class="fullElem daily-planner-fullpage">
      <button class="back"  id="1">Close</button>
      <h2>Plan your Day to be more Productive</h2>
    </section> 
    <section class="fullElem motivational-fullpage">
      <button class="back"  id="2">Close</button>
      <h1>Motivational Quoto</h1>
      
    </section>
    <section class="fullElem Pomodoro-fullpage">
      <button class="back"  id="3">Close</button>
      <h1>Pomodoro Timer</h1>
    </section>
    <section class="fullElem daily-goals-fullpage" >
      <button class="back" id="4">Close</button>
      <h1>Daily Goals</h1>
    </section>

  </div>
  <script src="script.js"></script>
  
</body>
</html>
