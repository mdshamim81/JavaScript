<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>    
  <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
</head>
<body class="min-h-screen bg-[#030712] text-white font-sans flex items-center justify-center p-5">

  <main class="w-full max-w-[530px]">

    <!-- Header -->
    <header class="text-center mb-5">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
        GitHub User Finder
      </h1>
      <p class="text-gray-400 text-xs sm:text-sm mt-2">
        Search and view GitHub user profiles in style
      </p>
    </header>

    <!-- Search Bar -->
    <div class="flex items-center gap-2 bg-[#1e293b] p-2 rounded-lg mb-5">
      <input
        type="text"
        placeholder="Enter GitHub username..."
        class="usernameinp flex-1 min-w-0 bg-transparent outline-none px-2 py-2 text-sm text-white placeholder-gray-400"
      >

      <button
        type="button"
        class="search bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-md text-xs sm:text-sm font-medium transition"
      >
        Search
      </button>
    </div>

    <!-- GitHub Profile Card -->
    <section class="card bg-[#111827] border border-gray-700/80 rounded-xl p-5">

      
        

    </section>

    <!-- Footer -->
    <footer class="text-center text-gray-500 text-[10px] mt-8">
      Built with ❤️ using Tailwind CSS
    </footer>

  </main>
<script src="script.js"></script>
</body>
</html>
